<!doctype html>
<!-- Dev tool: loads any glTF/GLB and stands it on a metre grid, so a reference model can
     be checked for scale, facing and quality before anything is built from it.
     Open http://localhost:8000/tools/model.html?src=../models/geely.glb
     Options: &view=side|front|top   &grid=0   &wire=1 -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ZRace — model check</title>
<style>
  html, body { margin: 0; background: #0c0f13; color: #eef2f6; font: 13px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #info { position: fixed; left: 12px; top: 10px; line-height: 1.55; text-shadow: 0 2px 8px #000; white-space: pre; }
  #hint { position: fixed; left: 12px; bottom: 10px; color: #7c8794; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info">loading…</div>
<div id="hint">?src=../models/x.glb · &view=side|front|top · &wire=1 · drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const src = q.get('src');
const view = q.get('view') || '';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0c0f13');
scene.add(new THREE.HemisphereLight('#cfe3ff', '#0c0f13', 1.6));
const key = new THREE.DirectionalLight('#ffffff', 2.4);
key.position.set(6, 10, 8);
scene.add(key, new THREE.DirectionalLight('#9fd3ff', 0.9).translateX(-8).translateY(4).translateZ(-7));

// one metre per square, 10 m across, so scale can be read straight off the floor
if (q.get('grid') !== '0') {
  const grid = new THREE.GridHelper(10, 10, '#38506b', '#1c2836');
  scene.add(grid);
  scene.add(new THREE.AxesHelper(1));       // +X red, +Y green, +Z blue
}

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 200);
let yaw = view === 'side' ? Math.PI / 2 : view === 'front' ? 0 : -0.7;
let pitch = view === 'top' ? 1.3 : view ? 0.06 : 0.35;
let dist = 12;
const target = new THREE.Vector3(0, 0.8, 0);
function frame() {
  camera.position.set(
    target.x + Math.sin(yaw) * Math.cos(pitch) * dist,
    target.y + Math.sin(pitch) * dist,
    target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(target);
}

const info = document.getElementById('info');
if (!src) {
  info.textContent = 'no ?src= given';
} else {
  new GLTFLoader().load(src, (gltf) => {
    const root = gltf.scene;
    scene.add(root);
    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    const mid = box.getCenter(new THREE.Vector3());
    let tris = 0, meshes = 0;
    const mats = new Set();
    root.traverse((o) => {
      if (!o.isMesh) return;
      meshes++;
      const g = o.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      for (const m of [].concat(o.material)) mats.add(m.name || '(unnamed)');
      if (q.get('wire') === '1') o.material = new THREE.MeshBasicMaterial({ color: '#7fd8ff', wireframe: true });
    });
    // stand it on the grid with the origin under its centre, so the metre squares read true
    root.position.sub(new THREE.Vector3(mid.x, box.min.y, mid.z));
    target.set(0, size.y / 2, 0);
    dist = Math.max(size.x, size.y, size.z) * 2.1;
    frame();
    info.textContent = [
      src.split('/').pop(),
      `size   ${size.x.toFixed(3)} x ${size.y.toFixed(3)} x ${size.z.toFixed(3)} m`,
      `meshes ${meshes}   triangles ${Math.round(tris).toLocaleString()}`,
      `materials ${mats.size}`,
    ].join('\n');
  }, undefined, (e) => { info.textContent = 'failed to load ' + src + '\n' + e; });
}
frame();

let drag = null;
addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  yaw -= (e.clientX - drag[0]) * 0.01;
  pitch = Math.max(-0.4, Math.min(1.5, pitch + (e.clientY - drag[1]) * 0.006));
  drag = [e.clientX, e.clientY];
  frame();
});
addEventListener('wheel', (e) => { dist = Math.max(1, dist * (1 + Math.sign(e.deltaY) * 0.1)); frame(); });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  frame();
});

renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
